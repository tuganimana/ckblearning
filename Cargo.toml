[package]
name = "ckb-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
ckb-sdk = "5.1.0"
dotenvy = "0.15"
rand = "0.10.2"
secp256k1 = "0.30.0"
serde_json = "1.0.150"
ckb-types = "1.1.2"
ckb-jsonrpc-types = "1.1.2"
ckb-crypto = "1.1.1"
hex = "0.4.3"
anyhow = "1.0.103"
bip39 = { version = "2", features = ["rand"] }
bip32 = "0.5.0"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.24.0", features = ["v4"] }
axum = "0.8.9"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
