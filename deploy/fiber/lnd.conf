# LND (Bitcoin testnet) for Fiber CCH payer.
# Data dir on the Droplet: ~/fiber-node/lnd  (mounted at /root/.lnd in Docker).
# Fiber CCH connects to https://127.0.0.1:10009 with tls.cert + admin.macaroon.

[Application Options]
listen=0.0.0.0:9735
rpclisten=127.0.0.1:10009
restlisten=127.0.0.1:8080
tlsextradomain=localhost
tlsextraip=127.0.0.1
# Created/updated by deploy-fiber.yml
wallet-unlock-password-file=/root/.lnd/wallet-password.txt
accept-keysend=true
accept-amp=true
alias=kaze-fiber-cch-lnd

[Bitcoin]
bitcoin.active=1
bitcoin.testnet=1
bitcoin.node=neutrino

[Neutrino]
neutrino.addpeer=faucet.lightning.community
neutrino.addpeer=btcd1.nodes.lightning.computer:18333
neutrino.addpeer=btcd2.nodes.lightning.computer:18333

[protocol]
protocol.wumbo-channels=true
