name: Build and Deploy Kaze CKB app

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  IMAGE_NAME: ${{ secrets.DO_REGISTRY_NAME }}/kaze-ckb
  CONTAINER_NAME: kaze-ckb
  # Must match Dockerfile ENV PORT / EXPOSE
  APP_PORT: "8080"

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DROPLET_PASSWORD: ${{ secrets.DROPLET_PASSWORD }}
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          envs: DROPLET_PASSWORD,DO_TOKEN,REGISTRY,IMAGE,IMAGE_TAG,CONTAINER_NAME,APP_PORT
          script: |
            set -euxo pipefail

            sdocker() { echo "$DROPLET_PASSWORD" | sudo -S docker "$@"; }

            FULL_IMAGE="$IMAGE:$IMAGE_TAG"
            ENV_FILE="/home/telesphore/kaze-ckb/.env"

            echo "Logging into registry..."
            echo "$DROPLET_PASSWORD" | sudo -S sh -c "printf '%s' \"$DO_TOKEN\" | docker login \"$REGISTRY\" -u \"$DO_TOKEN\" --password-stdin"

            echo "Pulling image..."
            sdocker pull "$FULL_IMAGE"

            echo "Stopping old container..."
            sdocker stop "$CONTAINER_NAME" || true
            sdocker rm "$CONTAINER_NAME" || true

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing env file: $ENV_FILE" >&2
              exit 1
            fi

            echo "Starting new container..."
            sdocker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "${APP_PORT}:${APP_PORT}" \
              --env-file "$ENV_FILE" \
              -e "PORT=${APP_PORT}" \
              "$FULL_IMAGE"

            echo "Containers:"
            sdocker ps -a

            echo "Logs:"
            sdocker logs "$CONTAINER_NAME" --tail 100 || true

            sdocker image prune -f
