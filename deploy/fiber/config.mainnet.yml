# Fiber MAINNET config for the Droplet (.github/workflows/deploy-fiber.yml,
# network=mainnet). Lock scripts, bootnodes and UDT whitelist are copied from
# the official nervosnetwork/fiber v0.9.1 config/mainnet/config.yml — keep
# them in sync with the deployed image tag.
#
# Kaze pays/receives native CKB over Fiber (no CCH / LND on mainnet).
# Set secret FIBER_ANNOUNCED_ADDR (e.g. /ip4/YOUR.PUBLIC.IP/tcp/8228)
# so peers can dial this node.

fiber:
  listening_addr: "/ip4/0.0.0.0/tcp/8228"
  announced_node_name: "kaze"
  bootnode_addrs:
    - "/ip4/43.199.24.44/tcp/8228/p2p/QmZ2gCTfEF6vKsiYFF2STPeA2rRLRim9nMtzfwiE7uMQ4v"
    - "/ip4/54.255.71.126/tcp/8228/p2p/QmcMLnWraRyxd7PFRgvn1QeYRQS2DGsP6fPFCQjtfMs5b2"
  announce_listening_addr: true
  announced_addrs:
    # - "/ip4/YOUR.VPS.PUBLIC.IP/tcp/8228"
  chain: mainnet
  # https://github.com/nervosnetwork/fiber-scripts/blob/main/deployment/mainnet/migrations/2025-02-28-114908.json
  scripts:
    - name: FundingLock
      script:
        code_hash: 0xe45b1f8f21bff23137035a3ab751d75b36a981deec3e7820194b9c042967f4f1
        hash_type: type
        args: 0x
      cell_deps:
        - type_id:
            code_hash: 0x00000000000000000000000000000000000000000000000000545950455f4944
            hash_type: type
            args: 0x64818d82a372312fb007c480391e1b9759d21b2c7f7959b9c177d72cdc243394
        - cell_dep:
            out_point:
              tx_hash: 0x95006eee7b4c0c8ad66e0514c88ed0ae43fc8db27793427de86a348ec720b9d6 # ckb_auth
              index: 0x0
            dep_type: code
    - name: CommitmentLock
      script:
        code_hash: 0x2d45c4d3ed3e942f1945386ee82a5d1b7e4bb16d7fe1ab015421174ab747406c
        hash_type: type
        args: 0x
      cell_deps:
        - type_id:
            code_hash: 0x00000000000000000000000000000000000000000000000000545950455f4944
            hash_type: type
            args: 0xdb16e6dcb17f670e5fb7c556d81e522ec5edb069ad2fa3e898e7ccea6c26a39f
        - cell_dep:
            out_point:
              tx_hash: 0x95006eee7b4c0c8ad66e0514c88ed0ae43fc8db27793427de86a348ec720b9d6 # ckb_auth
              index: 0x0
            dep_type: code

rpc:
  # Private docker0 gateway (no biscuit auth needed). Fiber runs with
  # --network host; the app uses FIBER_RPC_URL=http://172.17.0.1:8227.
  listening_addr: "172.17.0.1:8227"

ckb:
  # Trusted mainnet CKB RPC. Prefer your own full node for production.
  rpc_url: "https://mainnet.ckbapp.dev/"
  udt_whitelist:
    ## https://github.com/CKBFansDAO/xudtlogos/blob/f2557839ecde0409ba674516a62ae6752bc0daa9/public/tokens/token_list.json#L548
    - name: USDI
      script:
        code_hash: 0xbfa35a9c38a676682b65ade8f02be164d48632281477e36f8dc2f41f79e56bfc
        hash_type: type
        args: 0xd591ebdc69626647e056e13345fd830c8b876bb06aa07ba610479eb77153ea9f
      cell_deps:
        - type_id:
            code_hash: 0x00000000000000000000000000000000000000000000000000545950455f4944
            hash_type: type
            args: 0x9105ea69838511ca609518d27855c53fed1b5ffaff4cfb334f58b40627d211c4
      auto_accept_amount: 10000000

services:
  - fiber
  - rpc
  - ckb
